[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainovel-publisher-companion"
version = "0.3.3"
description = "Windows companion for incremental ainovel chapter publishing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "paramiko>=3.5,<5",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pyinstaller>=6.11,<7",
  "playwright>=1.58,<2",
]

[project.scripts]
ainovel-publisher = "ainovel_companion.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
