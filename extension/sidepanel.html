<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ainovel 发布助手</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div>
      <h1>Ainovel 发布助手</h1>
      <p>登录番茄后，只需点击一次“检查并处理下一章”。</p>
    </div>
    <span id="connectionBadge" class="badge neutral">未连接</span>
  </header>

  <details class="panel" id="settingsPanel">
    <summary>设置（首次使用或修改发布时间时打开）</summary>
    <label>接口地址<input id="baseUrl" value="http://127.0.0.1:8787"></label>
    <label>API Token<input id="apiToken" type="password" autocomplete="off"></label>
    <div class="settings-grid">
      <label>每日安全上限（字）<input id="dailyLimit" type="number" min="1" max="9999" value="9999"></label>
      <label>默认发布时间<select id="publicationSlot"><option value="12:00">每天 12:00</option><option value="20:00" selected>每天 20:00</option><option value="22:00">每天 22:00</option></select></label>
    </div>
    <label>最早排程日期<input id="planStartDate" type="date"></label>
    <label>AI 声明策略
      <select id="aiPolicy">
        <option value="remember" selected>按作品记住上次明确选择（推荐）</option>
        <option value="use">使用 AI</option>
        <option value="no">不使用 AI</option>
        <option value="ask">每章手动选择</option>
      </select>
    </label>
    <label class="check-label"><input id="automationEnabled" type="checkbox"> 启用已批准计划的自动执行（Edge 必须保持运行）</label>
    <div class="row">
      <button id="saveSettings">保存并测试</button>
      <button id="syncNow" class="secondary">同步服务器</button>
    </div>
  </details>

  <section class="panel status-panel">
    <strong id="statusTitle">等待连接本地助手</strong>
    <p id="statusDetail">请先启动 Windows 本地助手并填写 Token。</p>
  </section>

  <section class="panel toolbar">
    <label>作品<select id="bookSelect"></select></label>
    <label>状态
      <select id="statusFilter">
        <option value="ready">待处理</option>
        <option value="filled">已填充待处理</option>
        <option value="version_conflict">版本冲突</option>
        <option value="legacy_draft">旧草稿</option>
        <option value="legacy_published">旧已发布</option>
        <option value="scheduled">已定时</option>
        <option value="blocked">已阻塞</option>
        <option value="awaiting_ai_choice">等待手动选择 AI</option>
        <option value="">全部</option>
      </select>
    </label>
    <button id="refreshList" class="secondary">刷新队列</button>
  </section>

  <section class="panel plan-panel">
    <div class="section-title"><h2>发布控制台</h2><span id="planBadge" class="badge neutral">尚未排程</span></div>
    <button id="smartRunNext" class="main-action">检查并处理下一章</button>
    <p class="safe-note">插件会等待页面加载稳定，再核对、排程并处理；平台已有章节绝不重复提交。</p>

    <details class="advanced-panel">
      <summary>查看平台状态与排程（只读）</summary>
      <button id="inspectPlatform" class="secondary read-only-action">仅重新读取平台状态（不发布）</button>
      <div id="platformSummary" class="platform-summary neutral">尚未读取番茄章节列表。</div>
      <div id="planList" class="plan-list">尚未生成发布排程。</div>
    </details>
  </section>
  <main>
    <section class="panel list-panel">
      <div class="section-title"><h2>章节队列</h2><span id="queueCount">0</span></div>
      <div id="chapterList" class="chapter-list"></div>
    </section>

    <section class="panel preview-panel">
      <div class="section-title"><h2 id="previewTitle">未选择章节</h2><span id="previewStatus" class="badge neutral">—</span></div>
      <p id="previewMeta" class="muted">从左侧队列选择一章。</p>
      <pre id="previewBody"></pre>
      <button id="smartChapterAction" disabled>处理本章</button>
      <div id="actionResult" class="action-result neutral">选择一章后，插件会告诉你唯一需要做的下一步。</div>
      <p class="warning">验证码、风控、内容冲突或未知页面仍会停止，不会绕过安全检查。</p>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
